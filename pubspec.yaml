name: cat
description: "Interactive Radon Transform & X-Ray CAT Scan Demonstration"
publish_to: 'none'
version: 2.1.0+0

environment:
  sdk: ">=3.13.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  google_fonts: ^8.0.1
  package_info_plus: ^10.2.0
  flex_color_picker: ^3.7.0
  url_launcher: ^6.3.1
  web: ^1.1.0
  html_tweak:
    path: ./html_tweak

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - path: assets/info.html
      transformers:
        - package: html_tweak
    - path: assets/info_de.html
      transformers:
        - package: html_tweak
    - path: assets/info_es.html
      transformers:
        - package: html_tweak
    - path: assets/info_fr.html
      transformers:
        - package: html_tweak
    - path: assets/info_ja.html
      transformers:
        - package: html_tweak
    - path: assets/info_lt.html
      transformers:
        - package: html_tweak
    - path: assets/info_pt.html
      transformers:
        - package: html_tweak
    - path: assets/info_zh.html
      transformers:
        - package: html_tweak
    - assets/privacy.html
    - assets/privacy_de.html
    - assets/privacy_es.html
    - assets/privacy_fr.html
    - assets/privacy_ja.html
    - assets/privacy_lt.html
    - assets/privacy_pt.html
    - assets/privacy_zh.html
    - assets/terms.html
    - assets/terms_de.html
    - assets/terms_es.html
    - assets/terms_fr.html
    - assets/terms_ja.html
    - assets/terms_lt.html
    - assets/terms_pt.html
    - assets/terms_zh.html
    - assets/dev/
    - assets/css/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#000000"
    theme_color: "#1e88e5"
